<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scanner Absensi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#16243a;--muted:#5d6b7e;--line:#dfe5e0;--bg:#eef2ee;--green:#0e6b52;--green-d:#0a4f3c;--green-l:#dcefe7;--yellow:#f2b705;--yellow-l:#fff3cc;--red:#c2362f;--red-l:#fbe3e1}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom)}
button,input,select{font:inherit;color:inherit}
.hidden{display:none!important}
.muted{color:var(--muted)}
.wrap{max-width:520px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(22,36,58,.08)}
h1{font-size:1.3rem;margin:0 0 4px}
label{display:block;font-weight:600;font-size:.85rem;margin:12px 0 5px}
input,select{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
input:focus,select:focus,button:focus-visible{outline:3px solid rgba(14,107,82,.25);border-color:var(--green)}
.btn{background:var(--green);color:#fff;border:0;padding:12px 18px;border-radius:10px;font-weight:700;cursor:pointer}
.btn:hover{background:var(--green-d)}
.btn.ghost{background:#fff;color:var(--green);border:1.5px solid var(--green)}
.btn.block{width:100%;margin-top:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{flex:1 1 auto}
.login-top{background:var(--green);color:#fff;border-radius:16px;padding:22px;margin-bottom:14px;position:relative;overflow:hidden}
.login-top::after{content:"";position:absolute;right:-26px;top:-26px;width:96px;height:96px;border-radius:50%;background:var(--yellow)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.bar b{display:block}
.clock{font-weight:800;font-size:1.4rem;letter-spacing:.5px}
#reader{width:100%;border-radius:14px;overflow:hidden;background:#0d1520;min-height:260px}
.res{margin:14px 0;padding:18px;border-radius:14px;background:var(--bg);text-align:center;font-weight:600;border:2px dashed var(--line)}
.res big{display:block;font-size:1.35rem;margin-bottom:2px}
.res.ok{background:var(--green-l);border:2px solid var(--green);color:var(--green-d)}
.res.err{background:var(--red-l);border:2px solid var(--red);color:#7c1d18}
.res.dup{background:var(--yellow-l);border:2px solid var(--yellow);color:#6a4e00}
.bdg{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.78rem;font-weight:700;background:#e8ecf1}
.bdg.hadir{background:var(--green-l);color:var(--green-d)}.bdg.terlambat{background:var(--yellow-l);color:#7a5a00}.bdg.alfa{background:var(--red-l);color:var(--red)}
.log div{padding:7px 0;border-bottom:1px solid var(--line)}
.err-msg{color:var(--red);font-weight:600;margin-top:10px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script>
/* ============================================================
   ISI DENGAN URL WEB APP APPS SCRIPT KAMU (yang berakhiran /exec)
   ============================================================ */
const API_URL ='https://script.google.com/macros/s/AKfycbybiMJ41q3FOnmvSOnt3fJInJqrjN7NGLSv7gDTK1ZpRauSdw_YgGfG3vJcRXwgMqh1/exec';

let TOKEN = null, USER = null, scanner = null, facing = 'environment', lastCode = '', lastT = 0, clockTimer = null;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function api(action, payload) {
  if (!/^https:\/\/script\.google\.com\//.test(API_URL)) throw new Error('URL web app belum diisi di file scanner.html (baris API_URL).');
  const r = await fetch(API_URL, { method: 'POST', redirect: 'follow', body: JSON.stringify({ action: action, token: TOKEN, payload: payload || {} }) });
  const j = await r.json();
  if (j && j.error) { if (j.expired) setTimeout(logout, 50); throw new Error(j.error); }
  return j;
}

/* ---------- login ---------- */
function renderLogin(msg) {
  stopScan(); clearInterval(clockTimer);
  $('#app').innerHTML = `
    <div class="login-top"><h1>Scanner Absensi</h1><div style="opacity:.85">Masuk sebagai guru atau admin</div></div>
    <div class="card">
      <label for="role">Peran</label><select id="role"><option value="guru">Guru / Wali Kelas</option><option value="admin">Admin</option></select>
      <label for="uid">ID Guru / Username</label><input id="uid" autocomplete="username" autocapitalize="none">
      <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
      <div class="err-msg" id="lerr">${esc(msg || '')}</div>
      <button class="btn block" id="lbtn">Masuk</button>
    </div>`;
  $('#lbtn').onclick = doLogin;
  $('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
}
async function doLogin() {
  const btn = $('#lbtn'); btn.disabled = true; btn.textContent = 'Memeriksa...';
  try {
    const r = await api('login', { role: $('#role').value, id: $('#uid').value, password: $('#pw').value });
    TOKEN = r.token; USER = r.user;
    try { localStorage.setItem('scan_sess', JSON.stringify({ t: r.token, u: r.user })); } catch (e) {}
    renderScanner();
  } catch (e) { $('#lerr').textContent = e.message; btn.disabled = false; btn.textContent = 'Masuk'; }
}
function logout() {
  if (TOKEN) { try { api('logout'); } catch (e) {} }
  TOKEN = null; USER = null;
  try { localStorage.removeItem('scan_sess'); } catch (e) {}
  renderLogin();
}

/* ---------- scanner ---------- */
function renderScanner() {
  $('#app').innerHTML = `
    <div class="bar"><div><b>${esc(USER.name)}</b><span class="muted">Scanner absensi</span></div><div class="clock" id="clock"></div></div>
    <div class="card">
      <div id="reader"></div>
      <div class="row" style="margin-top:12px">
        <button class="btn" id="bstart">📷 Mulai kamera</button>
        <button class="btn ghost" id="bflip">🔄 Ganti kamera</button>
        <button class="btn ghost" id="bstop">Berhenti</button>
      </div>
      <div class="res" id="res">Tekan "Mulai kamera", lalu arahkan ke QR siswa</div>
      <label for="mn">Kamera bermasalah? Masukkan NISN manual</label>
      <div class="row"><input id="mn" inputmode="numeric" placeholder="NISN siswa" style="flex:2 1 160px"><button class="btn" id="bman" style="flex:1 1 90px">Catat</button></div>
    </div>
    <div class="card"><b>Scan terbaru</b><div class="log muted" id="log">Belum ada scan.</div></div>
    <button class="btn ghost block" id="bout">Keluar</button>`;
  $('#bstart').onclick = startScan;
  $('#bstop').onclick = stopScan;
  $('#bflip').onclick = async () => { facing = facing === 'environment' ? 'user' : 'environment'; await stopScan(); startScan(); };
  $('#bman').onclick = () => { const v = $('#mn').value.trim(); if (v) { sendScan(v); $('#mn').value = ''; } };
  $('#bout').onclick = logout;
  tick(); clearInterval(clockTimer); clockTimer = setInterval(tick, 1000);
  startScan();
}
function tick() { const c = $('#clock'); if (c) c.textContent = new Date().toTimeString().slice(0, 8); }

async function startScan() {
  if (scanner) return;
  try {
    scanner = new Html5Qrcode('reader');
    await scanner.start({ facingMode: { ideal: facing } }, { fps: 10, qrbox: (w, h) => { const m = Math.floor(Math.min(w, h) * 0.75); return { width: m, height: m }; } }, onScan, () => {});
  } catch (e) {
    scanner = null;
    const el = $('#res'); if (!el) return;
    el.className = 'res err';
    el.innerHTML = '<big>❌ Kamera tidak bisa dibuka</big>Izinkan akses kamera di browser (ikon gembok di samping alamat), pastikan halaman dibuka lewat https, lalu tekan "Mulai kamera" lagi.';
  }
}
async function stopScan() {
  if (scanner) { try { await scanner.stop(); scanner.clear(); } catch (e) {} scanner = null; }
}
function onScan(code) {
  const n = Date.now();
  if (code === lastCode && n - lastT < 4000) return;
  lastCode = code; lastT = n; sendScan(code);
}

function beep(ok) {
  try {
    const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain();
    o.connect(g); g.connect(a.destination); o.frequency.value = ok ? 880 : 220; g.gain.value = .15;
    o.start(); o.stop(a.currentTime + (ok ? .12 : .35));
  } catch (e) {}
  if (navigator.vibrate) navigator.vibrate(ok ? 80 : [120, 60, 120]);
}

async function sendScan(code) {
  let r;
  try { r = await api('scan', { code: code }); } catch (e) { r = { ok: false, error: true, msg: e.message }; }
  const el = $('#res'); if (!el) return;
  el.className = 'res ' + (r.ok ? 'ok' : (r.error || r.closed ? 'err' : 'dup'));
  el.innerHTML = `<big>${r.ok ? '✅' : r.error ? '❌' : '⚠️'} ${esc(r.nama || '')}</big>${r.kelas ? 'Kelas ' + esc(r.kelas) + ' · ' : ''}${esc(r.msg)}`;
  beep(!!r.ok);
  const log = $('#log');
  if (log.classList.contains('muted')) { log.classList.remove('muted'); log.innerHTML = ''; }
  log.insertAdjacentHTML('afterbegin', `<div>${new Date().toTimeString().slice(0, 5)} · <b>${esc(r.nama || 'Tidak dikenal')}</b> ${r.status ? `<span class="bdg ${esc(String(r.status).toLowerCase())}">${esc(r.status)}</span>` : ''} <span class="muted">${r.ok ? '' : esc(r.msg)}</span></div>`);
}

/* ---------- mulai ---------- */
(async function init() {
  // 1) Dibuka dari aplikasi utama: tukar tiket sekali pakai menjadi sesi (tanpa login lagi)
  const m = location.hash.match(/[#&]k=([^&]+)/);
  if (m) {
    history.replaceState(null, '', location.pathname + location.search); // hapus tiket dari alamat
    $('#app').innerHTML = '<div class="card"><b>Menyiapkan scanner...</b><div class="muted">Mohon tunggu sebentar.</div></div>';
    try {
      const r = await api('redeem', { ticket: decodeURIComponent(m[1]) });
      TOKEN = r.token; USER = r.user;
      try { localStorage.setItem('scan_sess', JSON.stringify({ t: r.token, u: r.user })); } catch (e) {}
      renderScanner(); return;
    } catch (e) { renderLogin(e.message); return; }
  }
  // 2) Sesi tersimpan dari pemakaian sebelumnya
  try {
    const s = JSON.parse(localStorage.getItem('scan_sess') || 'null');
    if (s && s.t) { TOKEN = s.t; USER = s.u; renderScanner(); return; }
  } catch (e) {}
  // 3) Login manual
  renderLogin();
})();
</script>
</body>
</html>
